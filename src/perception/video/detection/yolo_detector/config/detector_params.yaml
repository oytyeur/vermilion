yolo_detector_node:
  ros__parameters:
    # Читаемый топик
    image_topic: "/camera/raw_frame"

    # Путь до модели и выбор девайсв
    model: "src/perception/video/detection/yolo_detector/yolov8n.pt"
    # model: "/home/oytyeur/workspace/MGTS/Unitree/Go2Edu/vermilion/yolov8n.pt"
    # model: "/home/aboba/vermilion/yolov8n.pt"
    device: "cpu"

    # Настройка модели
    detection_threshold: 0.5
    enable_tracking: true
    publish_annotated_image: true
    # Найстройка рвиза
    qos_depth: 10
    reliability: "best_effort"
    